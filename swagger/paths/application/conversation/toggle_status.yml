tags:
  - Conversations
operationId: toggle-status-of-a-conversation
summary: Toggle Status
description: |-
  Toggle the status of a ticket. Pass `status` to set it explicitly. Agents can set `open`,
  `waiting_on_customer` (Pending), `on_hold`, `resolved` and `pending` (hand the ticket to the bot);
  `new_ticket` and `closed` are set by the system and return 422. Resolving an unassigned ticket
  assigns it to the agent who resolved it.
security:
  - userBearerAuth: []
  - agentBotBearerAuth: []
  - userApiKey: []
  - agentBotApiKey: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        type: object
        required:
          - status
        properties:
          status:
            type: string
            enum: ['open', 'waiting_on_customer', 'on_hold', 'resolved', 'pending']
            description: The ticket status
            example: open
responses:
  '200':
    description: Success
    content:
      application/json:
        schema:
          type: object
          properties:
            meta:
              type: object
            payload:
              type: object
              properties:
                success:
                  type: boolean
                current_status:
                  type: string
                  enum: ['new_ticket', 'open', 'waiting_on_customer', 'on_hold', 'resolved', 'closed', 'pending']
                conversation_id:
                  type: number
  '404':
    description: Conversation not found
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
  '401':
    description: Unauthorized
    content:
      application/json:
        schema:
          $ref: '#/components/schemas/bad_request_error'
