type: object
properties:
  id:
    type: number
    description: ID of the conversation
  messages:
    type: array
    items:
      $ref: '#/components/schemas/message'
  account_id:
    type: number
    description: Account Id
  uuid:
    type: string
    description: UUID of the conversation
  additional_attributes:
    type: object
    description: The object containing additional attributes related to the conversation
  agent_last_seen_at:
    type: number
    description: The last activity at of the agent
  assignee_last_seen_at:
    type: number
    description: The last activity at of the assignee
  can_reply:
    type: boolean
    description: Whether the conversation can be replied to
  contact_last_seen_at:
    type: number
    description: The last activity at of the contact
  custom_attributes:
    type: object
    description: The object to save custom attributes for conversation, accepts custom attributes key and value
  inbox_id:
    type: number
    description: ID of the inbox
  labels:
    type: array
    items:
      type: string
    description: The labels of the conversation
  muted:
    type: boolean
    description: Whether the conversation is muted
  status:
    type: string
    enum: ['new_ticket', 'open', 'waiting_on_customer', 'on_hold', 'resolved', 'closed', 'pending']
    description: >-
      The ticket status. `new_ticket`, `open`, `waiting_on_customer` (Pending), `on_hold`, `resolved` (Solved)
      and `closed` follow Zendesk; `pending` means a bot is handling the ticket.
  subject:
    type:
      - string
      - 'null'
    description: Ticket subject (up to 150 characters)
  ticket_type:
    type:
      - string
      - 'null'
    enum: ['question', 'incident', 'problem', 'task', null]
    description: Ticket type
  due_at:
    type:
      - number
      - 'null'
    description: Due date of a task ticket (Unix timestamp)
  submitter_id:
    type:
      - number
      - 'null'
    description: ID of the agent who created the ticket on the requester's behalf
  company_id:
    type:
      - number
      - 'null'
    description: ID of the requester's company
  company_name:
    type:
      - string
      - 'null'
    description: Name of the requester's company
  created_at:
    type: number
    description: The time at which conversation was created
  updated_at:
    type: number
    description: The time at which conversation was updated
  timestamp:
    type: number
    description: The time at which conversation was created
  first_reply_created_at:
    type:
      - number
      - 'null'
    description: The time at which the first reply was created
  unread_count:
    type: number
    description: The number of unread messages
  last_non_activity_message:
    oneOf:
      - $ref: '#/components/schemas/message'
      - type: 'null'
    description: The last non activity message
  last_activity_at:
    type: number
    description: The last activity at of the conversation
  priority:
    type:
      - string
      - 'null'
    description: The priority of the conversation
  waiting_since:
    type:
      - number
      - 'null'
    description: The time at which the conversation was waiting
  sla_policy_id:
    type:
      - number
      - 'null'
    description: The ID of the SLA policy
  applied_sla:
    type: object
    description: The applied SLA
  sla_events:
    type: array
    items:
      type: object
      description: SLA event objects

