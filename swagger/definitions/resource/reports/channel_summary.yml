type: object
description: Channel summary report containing ticket counts grouped by channel type and status. Available in version 4.10.0+.
additionalProperties:
  type: object
  description: Ticket statistics for a specific channel type (e.g., Channel::WebWidget, Channel::Api)
  properties:
    new_ticket:
      type: number
      description: Number of new tickets
    open:
      type: number
      description: Number of open tickets
    waiting_on_customer:
      type: number
      description: Number of pending tickets (waiting on the customer)
    on_hold:
      type: number
      description: Number of on-hold tickets
    resolved:
      type: number
      description: Number of solved tickets
    closed:
      type: number
      description: Number of closed tickets
    pending:
      type: number
      description: Number of tickets handled by a bot
    total:
      type: number
      description: Total number of tickets
example:
  Channel::WebWidget:
    new_ticket: 3
    open: 10
    waiting_on_customer: 4
    on_hold: 2
    resolved: 20
    closed: 6
    pending: 5
    total: 50
