# ServiceDesk: imagem Docker de produção do fork, sempre sem enterprise/ (edição CE), e as imagens dos
# serviços próprios (job "services": sd-ops, qa-pipeline e sd-console em ghcr.io/<dono>/servicedesk-<nome>).
#
# Publica em ghcr.io/<dono>/servicedesk com as tags:
#   :<sha curto>         em todo build publicado
#   :servicedesk-main    só quando o build é da branch servicedesk/main
#
# Remove enterprise/ como o upstream faz para as imagens -ce (publish_foss_docker.yml):
# rm -rf enterprise spec/enterprise e ENV CW_EDITION="ce" no Dockerfile.
# A verificação (docker/servicedesk/verify-ce-image.sh) falha o job se /app/enterprise
# existir na imagem ou se ChatwootApp.enterprise? for verdadeiro. Nesse caso nada é publicado.
# Detalhes em docs/CI-IMAGEM.md (repositório de documentação do projeto).

name: ServiceDesk image

on:
  push:
    branches:
      - servicedesk/main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      push:
        description: 'Publicar a imagem no GHCR (desmarque para só construir e verificar)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: servicedesk-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: servicedesk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # O build (gems + node_modules + assets) e o load no docker local passam de 10 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (edição CE)
        run: |
          rm -rf enterprise spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile
          test ! -e enterprise

      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${owner}/${IMAGE_NAME}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=servicedesk-main,enable=${{ github.ref == 'refs/heads/servicedesk/main' }}
          labels: |
            org.opencontainers.image.title=ServiceDesk
            org.opencontainers.image.description=ServiceDesk (fork do Chatwoot CE, sem enterprise)
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Constrói e carrega no docker local para verificar ANTES de publicar.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=servicedesk-amd64
          cache-to: type=gha,mode=max,scope=servicedesk-amd64

      - name: Verify CE image (sem enterprise)
        run: bash docker/servicedesk/verify-ce-image.sh "${IMAGE}:${SHORT_SHA}"

      - name: Login to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' || inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          {
            echo "### Imagem publicada"
            for t in $TAGS; do echo "- \`$t\`"; done
            echo
            echo "Digest: \`$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${SHORT_SHA}")\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Serviços do ServiceDesk fora do Chatwoot (mesma estratégia: build -> smoke -> login/push, tags <sha curto> e
  # servicedesk-main). Imagens: ghcr.io/<dono>/servicedesk-sd-ops, -qa-pipeline e -sd-console. Rodam em paralelo
  # ao job do Chatwoot; um falhar não impede os outros (fail-fast: false).
  services:
    name: services (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sd-ops
            context: servicedesk/integrations/pbx-bridge
            smoke: >-
              python -c "import sd_ops, pbx_bridge; from sd_ops.auth import SERVICE_PROFILES;
              assert 'n8n' in SERVICE_PROFILES; print('sd-ops ok')"
          - name: qa-pipeline
            context: servicedesk/integrations/qa-pipeline
            smoke: python -c "import qa_pipeline, faster_whisper; print('qa-pipeline ok')"
          - name: sd-console
            context: servicedesk/apps/sd-console
            # o entrypoint do nginx renderiza o template (envsubst) antes do nginx -t
            smoke: nginx -t
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image name
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${owner}/${IMAGE_NAME}-${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=servicedesk-main,enable=${{ github.ref == 'refs/heads/servicedesk/main' }}
          labels: |
            org.opencontainers.image.title=ServiceDesk ${{ matrix.name }}
            org.opencontainers.image.description=ServiceDesk ${{ matrix.name }} (${{ matrix.context }})
            org.opencontainers.image.licenses=MIT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=servicedesk-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=servicedesk-${{ matrix.name }}

      - name: Smoke test
        env:
          SMOKE: ${{ matrix.smoke }}
        run: |
          # comando da matriz como argumentos do container (passa pelo ENTRYPOINT da imagem)
          eval "docker run --rm \"\${IMAGE}:\${SHORT_SHA}\" ${SMOKE}"
          # nenhuma das imagens roda como root
          docker run --rm --entrypoint sh "${IMAGE}:${SHORT_SHA}" -c 'test "$(id -u)" != 0'

      - name: Login to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' || inputs.push
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for t in $TAGS; do docker push "$t"; done
          {
            echo "### ${{ matrix.name }}"
            for t in $TAGS; do echo "- \`$t\`"; done
            echo
            echo "Digest: \`$(docker image inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${SHORT_SHA}")\`"
          } >> "$GITHUB_STEP_SUMMARY"
