# TODO: Move this values to features.yml itself
# No need to replicate the same values in two places

# ------- Product Features ------- #
help_center:
  name: 'Help Center'
  description: 'Allow agents to create help center articles and publish them in a portal.'
  enabled: true
  icon: 'i-lucide-book-open'

# ------- Communication Channels ------- #
live_chat:
  name: 'Live Chat'
  description: 'Improve your customer experience using a live chat on your website.'
  enabled: true
  icon: 'i-lucide-message-circle'
email:
  name: 'Email'
  description: 'Manage your email customer interactions in one place.'
  enabled: true
  icon: 'i-lucide-mail'
  config_key: 'email'
sms:
  name: 'SMS'
  description: 'Manage your SMS customer interactions in one place.'
  enabled: true
  icon: 'i-lucide-message-square-text'
messenger:
  name: 'Messenger'
  description: 'Stay connected with your customers on Facebook & Instagram.'
  enabled: true
  icon: 'i-logos-messenger'
  config_key: 'facebook'
instagram:
  name: 'Instagram'
  description: 'Stay connected with your customers on Instagram'
  enabled: true
  icon: 'i-logos-instagram-icon dark:invert'
  config_key: 'instagram'
tiktok:
  name: 'TikTok'
  description: 'Stay connected with your customers on TikTok'
  enabled: true
  icon: 'i-logos-tiktok-icon dark:invert'
  config_key: 'tiktok'
whatsapp:
  name: 'WhatsApp'
  description: 'Manage your WhatsApp business interactions in one place.'
  enabled: true
  icon: 'i-logos-whatsapp-icon'
telegram:
  name: 'Telegram'
  description: 'Manage your Telegram customer interactions in one place.'
  enabled: true
  icon: 'i-logos-telegram'
line:
  name: 'Line'
  description: 'Manage your Line customer interactions in one place.'
  enabled: true
  icon: 'i-ri-line-fill text-[#06C755]'

# ------- OAuth & Authentication ------- #
google:
  name: 'Google'
  description: 'Configuration for setting up Google OAuth Integration'
  enabled: true
  icon: 'i-logos-google-icon'
  config_key: 'google'
microsoft:
  name: 'Microsoft'
  description: 'Configuration for setting up Microsoft Email'
  enabled: true
  icon: 'i-logos-microsoft-icon'
  config_key: 'microsoft'

# ------- Third-party Integrations ------- #
stripe:
  name: 'Stripe'
  description: 'Configure the Stripe customer billing integration'
  enabled: true
  icon: 'i-woot-stripe-color'
  config_key: 'stripe'
linear:
  name: 'Linear'
  description: 'Configuration for setting up Linear Integration'
  enabled: true
  icon: 'i-logos-linear-icon dark:invert'
  config_key: 'linear'
notion:
  name: 'Notion'
  description: 'Configuration for setting up Notion Integration'
  enabled: true
  icon: 'i-logos-notion-icon dark:invert'
  config_key: 'notion'
slack:
  name: 'Slack'
  description: 'Configuration for setting up Slack Integration'
  enabled: true
  icon: 'i-logos-slack-icon'
  config_key: 'slack'
whatsapp_embedded:
  name: 'WhatsApp Embedded'
  description: 'Configuration for setting up WhatsApp Embedded Integration'
  enabled: true
  icon: 'i-logos-whatsapp-icon'
  config_key: 'whatsapp_embedded'
shopify:
  name: 'Shopify'
  description: 'Configuration for setting up Shopify Integration'
  enabled: true
  icon: 'i-logos-shopify'
  config_key: 'shopify'
