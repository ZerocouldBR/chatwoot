server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  # O /cti é carregado em iframe pelo Chatwoot: só o domínio do ServiceDesk pode embutir.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self' ${SD_FRAME_ANCESTORS}" always;
  location /sd-console/assets/ { expires 30d; add_header Cache-Control "public, immutable"; }
  location /sd-console/ { try_files $uri /sd-console/index.html; add_header Cache-Control "no-cache"; }
  location = /healthz { return 200 "ok"; }
}
