# Template (envsubst do entrypoint do nginx): só ${SD_FRAME_ANCESTORS} é substituída.
# Atenção: add_header dentro de um location anula os do server, por isso os cabeçalhos de segurança
# são repetidos em cada location.
server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;

  location /sd-console/assets/ {
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
  }

  location /sd-console/ {
    try_files $uri /sd-console/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache" always;
    # O /cti é carregado em iframe pelo Chatwoot: só o próprio site e o domínio do ServiceDesk podem embutir.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'self' ${SD_FRAME_ANCESTORS}" always;
  }

  location = /healthz {
    default_type text/plain;
    return 200 "ok";
  }
}
