# Alembic PRÓPRIO do qa-pipeline: schema "qa", tabela de versão qa.alembic_version.
# A URL vem de DATABASE_URL (nunca neste arquivo).
[alembic]
script_location = %(here)s/qa_pipeline/migrations
prepend_sys_path = .

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
